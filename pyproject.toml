[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonpeel"
version = "0.1.0"
description = "Peek inside JSON from the terminal: pretty-print, query by dot-path, and diff two files."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Krrish", email = "codewithkrrish7@gmail.com"}]
keywords = ["json", "cli", "pretty-print", "diff", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Text Processing",
]

[project.scripts]
jsonpeel = "jsonpeel.cli:main"

[project.urls]
Homepage = "https://github.com/codewithkrrish/jsonpeel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
